services:
  agent-server:
    image: vibe-agent-graph:dev
    ports:
      - "8123:8000"
    env_file: .env.docker
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
